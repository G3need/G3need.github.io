name: build apk

# Everdeen builds on a phone, not on the Windows box: no local Android SDK, no
# Gradle, and only Java 8 (the Android Gradle Plugin needs 17). This is the
# remote twin of colab_build.sh. Run it from the Actions tab, or let a change to
# tess-archery/** trigger it. The APK comes out as a downloadable artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tess-archery/**']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: android sdk
        run: |
          set -e
          # android-actions/setup-android@v3 pulls its metadata from a storage
          # endpoint that returns InvalidAuthenticationInfo on this runner, so
          # install cmdline-tools directly instead, exactly like colab_build.sh.
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest" /tmp/cmdtools.zip
          curl -s -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          # $GITHUB_PATH only reaches LATER steps, so export it here too or
          # sdkmanager is 'command not found' on the very next line.
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
          echo "--- installed ---"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: stage the app into the apk project
        run: |
          set -e
          cd tess-archery/apk
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          # index.html and the whole assets dir must land directly under assets/,
          # not assets/assets/: the WebView loads file:///android_asset/
          cp ../index.html app/src/main/assets/
          cp -r ../assets/. app/src/main/assets/
          # launcher icons
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi
          for d in hdpi xhdpi xxhdpi; do
            cp ../assets/icon-512.png "app/src/main/res/mipmap-$d/ic_launcher.png"
          done
          echo "--- stage, then make every asset inline ---"
          # A WebView can refuse a subresource for many reasons and raise no
          # error at all, which reads as 'pending' and explains nothing. Inlining
          # removes the request path: a data URI renders or it does not. The
          # public web build keeps normal file refs and browser caching.
          python ../scripts/inline_assets.py \
            app/src/main/assets/index.html \
            app/src/main/assets/index.html
          echo "--- staged assets ---"
          find app/src/main/assets -type f | sed 's/^/  /'
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "--- verify nothing is nested one level too deep ---"
          if [ -d app/src/main/assets/assets ]; then echo "FATAL: assets/assets/ nesting broke the WebView"; exit 1; fi
          echo "--- verify no asset is fetched by reference any more ---"
          if grep -q 'src="assets/\|href="assets/' app/src/main/assets/index.html; then
            echo "FATAL: a referenced asset survived inlining"; exit 1
          fi
          grep -c 'src="data:image' app/src/main/assets/index.html | sed 's/^/  inline data-uri images: /'
          grep -c 'href="data:image' app/src/main/assets/index.html | sed 's/^/  inline data-uri icons:  /'

      - name: gradle 8.7
        run: |
          set -e
          if command -v gradle >/dev/null 2>&1; then
            echo "using the gradle already on the runner:"
            gradle --version | head -4
          else
            echo "no preinstalled gradle, downloading one"
            curl -sSL -o /tmp/gradle.zip -w 'http=%{http_code} bytes=%{size_download}\n' \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip
            file /tmp/gradle.zip || true
            unzip -q /tmp/gradle.zip -d "$HOME"
            echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"
            echo "$HOME/gradle-8.7/bin" >> "$GITHUB_OUTPUT"
          fi
          gradle --version | head -4

      - name: build
        working-directory: tess-archery/apk
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tail -40

      - name: prove the apk really contains this build
        working-directory: tess-archery/apk
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "apk: $APK ($(du -h "$APK" | cut -f1))"
          # the elephant must be the new svg, not the blank png
          unzip -l "$APK" | grep -E 'elephant|index.html' | sed 's/^/  /'
          unzip -l "$APK" | grep -q 'assets/elephant.svg' || { echo "FATAL: elephant.svg not bundled"; exit 1; }
          unzip -l "$APK" | grep -q 'assets/elephant.png' && echo "  warning: stale blank elephant.png is still bundled" || echo "  stale blank elephant.png absent, good"
          # the supply form must be in the bundled html
          unzip -p "$APK" assets/index.html | grep -q 'id="mfName"' || { echo "FATAL: supply form missing from bundled html"; exit 1; }
          echo "  bundled html carries the supply form"

      - uses: actions/upload-artifact@v4
        with:
          name: everdeen-apk
          path: tess-archery/apk/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
