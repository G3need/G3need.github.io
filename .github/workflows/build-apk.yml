name: build-apk

on:
  push:
    paths:
      - 'tess-archery/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tess-archery/apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: assemble assets (public build + owner layer from secrets-free drive mirror)
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/tess-archery"
          rm -rf apk/app/src/main/assets
          mkdir -p apk/app/src/main/assets
          cp index.html apk/app/src/main/assets/
          cp -r assets/. apk/app/src/main/assets/
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "apk/app/src/main/res/mipmap-$d"
            cp assets/icon-512.png "apk/app/src/main/res/mipmap-$d/ic_launcher.png"
          done
          echo "assets staged: $(find apk/app/src/main/assets -type f | wc -l) files"

      - name: build debug apk
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew 2>/dev/null || true
          gradle wrapper --gradle-version 8.7 --no-daemon >/dev/null 2>&1 || true
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace || gradle assembleDebug --no-daemon --console=plain --stacktrace

      - name: locate apk
        run: |
          APK="$(find . -name '*.apk' -path '*debug*' | head -1)"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -la "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: quiver-apk
          path: tess-archery/apk/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
