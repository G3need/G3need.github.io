name: build-apk

on:
  push:
    paths:
      - 'tess-archery/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: install gradle 8.7
        run: |
          curl -sSL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q -d "$HOME" /tmp/g.zip
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: install android cmdline-tools
        run: |
          set -e
          mkdir -p "$HOME/android-sdk"
          cd "$HOME/android-sdk"
          rm -rf cmdline-tools
          curl -sSL -o c.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o c.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/NOTICE.txt \
             cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          test -x "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "sdkmanager ok"

      - name: accept licenses and install platform 34
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: stage assets
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/tess-archery"
          rm -rf apk/app/src/main/assets
          mkdir -p apk/app/src/main/assets
          cp index.html apk/app/src/main/assets/
          cp -r assets/. apk/app/src/main/assets/
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "apk/app/src/main/res/mipmap-$d"
            cp assets/icon-512.png "apk/app/src/main/res/mipmap-$d/ic_launcher.png"
          done
          echo "assets staged: $(find apk/app/src/main/assets -type f | wc -l) files"

      - name: build debug apk
        working-directory: tess-archery/apk
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/gradle.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "gradle exit: $RC"
          echo "=== error lines ==="
          grep -nE '(^e: |^> Task .* FAILED|FAILURE:|Execution failed|A problem occurred|Caused by|BUILD (FAILED|SUCCESSFUL))' /tmp/gradle.log | head -60
          echo "=== tail ==="
          tail -25 /tmp/gradle.log
          exit $RC

      - name: make a debug keystore
        run: |
          keytool -genkeypair -v -keystore "$HOME/quiver-debug.keystore" \
            -storetype PKCS12 -alias quiver -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Quiver Debug, OU=Debug, O=Quiver, L=Cairo, C=EG"
          echo "$HOME/quiver-debug.keystore" > /tmp/ks_path

      - name: sign the apk
        working-directory: tess-archery/apk
        run: |
          set -e
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER" || APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -1)"
          test -x "$APKSIGNER"
          UNSIGNED="app/build/outputs/apk/debug/app-debug.apk"
          SIGNED="$GITHUB_WORKSPACE/tess-archery/quiver-debug-signed.apk"
          "$APKSIGNER" sign --ks "$HOME/quiver-debug.keystore" --ks-pass pass:android \
            --key-pass pass:android --out "$SIGNED" "$UNSIGNED"
          "$APKSIGNER" verify --print-certs "$SIGNED"
          ls -la "$SIGNED"

      - name: upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiver-apk
          path: tess-archery/quiver-debug-signed.apk
          if-no-files-found: error
