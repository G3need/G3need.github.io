name: build-apk

on:
  push:
    paths:
      - 'tess-archery/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: install gradle 8.7
        run: |
          curl -sSL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q -d "$HOME" /tmp/g.zip
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: install android cmdline-tools
        run: |
          set -e
          mkdir -p "$HOME/android-sdk"
          cd "$HOME/android-sdk"
          rm -rf cmdline-tools
          curl -sSL -o c.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o c.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/NOTICE.txt \
             cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          test -x "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "sdkmanager ok"

      - name: accept licenses and install platform 34
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: stage assets
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/tess-archery"
          rm -rf apk/app/src/main/assets
          mkdir -p apk/app/src/main/assets
          # index.html sits at the asset ROOT, so every relative "assets/..." in it
          # resolves to file:///android_asset/assets/... That means the images must
          # live in assets/assets/ inside the APK, NOT flattened into the root.
          cp index.html apk/app/src/main/assets/
          mkdir -p apk/app/src/main/assets/assets
          cp -r assets/. apk/app/src/main/assets/assets/
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "apk/app/src/main/res/mipmap-$d"
            cp assets/icon-512.png "apk/app/src/main/res/mipmap-$d/ic_launcher.png"
          done
          # A WebView can refuse a subresource for half a dozen reasons and raise
          # no error event at all, so the symptom is an image that reports pending
          # and explains nothing. Four rounds of diagnosing that request path
          # produced four theories and no fix, so the request path is removed
          # instead of explained. A data URI asks nothing of the network, the file
          # system or a worker: it either renders or it does not, and that is
          # finally a legible answer.
          python scripts/inline_assets.py \
            index.html \
            apk/app/src/main/assets/index.html
          if grep -q 'src="assets/\|href="assets/' apk/app/src/main/assets/index.html; then
            echo "FATAL: a referenced asset survived inlining"; exit 1
          fi
          echo "inline data-uri images: $(grep -c 'src="data:image' apk/app/src/main/assets/index.html)"
          echo "inline data-uri icons:  $(grep -c 'href="data:image' apk/app/src/main/assets/index.html)"
          echo "staged index + $(find apk/app/src/main/assets -type f | wc -l) files"
          echo "asset root:"; ls apk/app/src/main/assets
          echo "asset root/assets/:"; ls apk/app/src/main/assets/assets
          test -f apk/app/src/main/assets/assets/hero.jpg

      - name: build debug apk
        working-directory: tess-archery/apk
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/gradle.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "gradle exit: $RC"
          echo "=== error lines ==="
          grep -nE '(^e: |^> Task .* FAILED|FAILURE:|Execution failed|A problem occurred|Caused by|BUILD (FAILED|SUCCESSFUL))' /tmp/gradle.log | head -60
          echo "=== tail ==="
          tail -25 /tmp/gradle.log
          exit $RC

      - name: install the signing key
        env:
          KS_B64: ${{ secrets.EVERDEEN_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.EVERDEEN_KEYSTORE_PASS }}
        run: |
          set -e
          KS="$HOME/everdeen-release.keystore"
          # Write the stable key from the repo secret. Generating one here instead
          # is what signed three builds with three different certificates, which
          # Play Protect reads as a fresh unknown developer and which makes every
          # update a reinstall that wipes the user's data.
          printf '%s' "$KS_B64" | base64 -d > "$KS"
          test -s "$KS"
          echo "$KS" > /tmp/ks_path
          printf '%s' "$KS_PASS" > /tmp/ks_pass
          keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias "${{ secrets.EVERDEEN_KEY_ALIAS }}" >/dev/null
          echo "signer loaded:"
          keytool -list -v -keystore "$KS" -storepass "$KS_PASS" -alias "${{ secrets.EVERDEEN_KEY_ALIAS }}" 2>/dev/null | grep -i "Owner:"

      - name: sign the apk
        working-directory: tess-archery/apk
        env:
          KS_PASS: ${{ secrets.EVERDEEN_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.EVERDEEN_KEY_ALIAS }}
        run: |
          set -e
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER" || APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -1)"
          test -x "$APKSIGNER"
          UNSIGNED="app/build/outputs/apk/debug/app-debug.apk"
          SIGNED="$GITHUB_WORKSPACE/tess-archery/quiver-debug-signed.apk"
          "$APKSIGNER" sign --ks "$(cat /tmp/ks_path)" \
            --ks-pass pass:"$KS_PASS" --key-pass pass:"$KS_PASS" --out "$SIGNED" "$UNSIGNED"
          "$APKSIGNER" verify --print-certs "$SIGNED"
          # Guard the fix rather than trusting it: an ephemeral signer is the bug
          # this replaced, so fail the build if it ever comes back.
          "$APKSIGNER" verify --print-certs "$SIGNED" | grep -q "SHA-256 digest: " || {
            echo "signer digest not printed; refusing to ship an unverified build"; exit 1; }
          ls -la "$SIGNED"

      - name: upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiver-apk
          path: tess-archery/quiver-debug-signed.apk
          if-no-files-found: error
