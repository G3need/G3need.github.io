<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="elephant">
  <defs>
    <linearGradient id="egbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="egbg" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#3b1d63"/>
      <stop offset="1" stop-color="#150a28"/>
    </radialGradient>
  </defs>

  <!-- tile background so the card always reads as a deliberate card -->
  <rect x="0" y="0" width="120" height="120" rx="14" fill="url(#egbg)"/>
  <ellipse cx="60" cy="62" rx="42" ry="40" fill="#fbbf24" opacity="0.10"/>

  <g fill="url(#egbody)">
    <!-- ground shadow -->
    <ellipse cx="60" cy="100" rx="36" ry="5" fill="#fbbf24" opacity="0.28"/>

    <!-- far pair of legs (drawn first, slightly darker by sitting under the body) -->
    <rect x="52" y="72" width="10" height="24" rx="5" opacity="0.72"/>
    <rect x="92" y="70" width="10" height="24" rx="5" opacity="0.72"/>

    <!-- body -->
    <ellipse cx="68" cy="56" rx="30" ry="24"/>

    <!-- near pair of legs -->
    <rect x="41" y="72" width="12" height="26" rx="6"/>
    <rect x="84" y="72" width="12" height="26" rx="6"/>

    <!-- tail, thin, with a tuft -->
    <path d="M 95 52 C 105 54, 111 63, 110 72 L 107 72 C 107 64, 102 58, 94 56 Z"/>

    <!-- head -->
    <circle cx="36" cy="50" r="20"/>

    <!-- ear -->
    <ellipse cx="41" cy="48" rx="12" ry="14"/>
    <ellipse cx="41" cy="48" rx="7" ry="9" fill="#150a28" opacity="0.22"/>
  </g>

  <!-- trunk: a hanging stroke with a curling tip -->
  <path d="M 27 63 C 21 78, 24 92, 34 98" fill="none" stroke="url(#egbody)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 34 98 C 40 101, 46 97, 46 90" fill="none" stroke="url(#egbody)" stroke-width="7" stroke-linecap="round"/>

  <!-- tusks -->
  <path d="M 30 70 C 25 76, 22 81, 21 86" fill="none" stroke="#fff7ed" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 37 73 C 34 79, 32 83, 32 88" fill="none" stroke="#fff7ed" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

  <!-- eye: negative space so it survives on any background -->
  <circle cx="30" cy="45" r="3.4" fill="#150a28"/>
  <circle cx="28.8" cy="43.9" r="1.1" fill="#fff7ed" opacity="0.9"/>
</svg>
