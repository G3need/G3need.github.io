plugins { id "com.android.application" }
android {
    namespace "agency.toku.quiver"
    compileSdk 34
    defaultConfig {
        applicationId "agency.toku.quiver"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
        debug { }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
    // the whole app ships as a single html plus assets, so no res stripping
    androidResources { ignoreAssetsPattern "!.svn:!.git:!*.js.map" }
}
dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.webkit:webkit:1.11.0"
}
