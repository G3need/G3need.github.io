// --- WebAudio Procedural Synthesizer (0 KB download) ---
let audioCtx = null;
let audioMuted = false;
let musicInterval = null;
let musicStep = 0;

function initAudio(){
  if (!audioCtx){
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) audioCtx = new AudioContextClass();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

audioToggle.addEventListener('click', () => {
  audioMuted = !audioMuted;
  audioToggle.textContent = audioMuted ? 'AUDIO: MUTED' : 'AUDIO: ON';
  if (!audioMuted) initAudio();
});

function playLaserSound(isPlayer){
  if (audioMuted || !audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  if (isPlayer){
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(780, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
  } else {
    osc.type = 'square';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
    gain.gain.setValueAtTime(0.14, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
  }
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + (isPlayer ? 0.08 : 0.12));
}

function playExplosionSound(isHeavy){
  if (audioMuted || !audioCtx) return;
  const now = audioCtx.currentTime;
  const dur = isHeavy ? 0.38 : 0.22;
  const bufSize = Math.floor(audioCtx.sampleRate * dur);
  const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(isHeavy ? 380 : 550, now);
  filter.frequency.exponentialRampToValueAtTime(45, now + dur);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(isHeavy ? 0.32 : 0.22, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start(now);
  noise.stop(now + dur);
}

function playHurtSound(){
  if (audioMuted || !audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(160, now);
  osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
  gain.gain.setValueAtTime(0.28, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.2);
}

// 138 BPM Procedural Synth Pulse
function start138Music(){
  if (musicInterval) clearInterval(musicInterval);
  musicStep = 0;
  // 138 BPM: 1 beat = 0.4348s -> 16th note = 108.7ms
  musicInterval = setInterval(() => {
    if (audioMuted || !running || !audioCtx) return;
    const now = audioCtx.currentTime;

    // Kick drum on quarter notes
    if (musicStep % 4 === 0){
      const kOsc = audioCtx.createOscillator();
      const kGain = audioCtx.createGain();
      kOsc.frequency.setValueAtTime(140, now);
      kOsc.frequency.exponentialRampToValueAtTime(36, now + 0.08);
      kGain.gain.setValueAtTime(0.22, now);
      kGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      kOsc.connect(kGain);
      kGain.connect(audioCtx.destination);
      kOsc.start(now);
      kOsc.stop(now + 0.1);
    }

    // Offbeat rolling 16th trance bass
    if (musicStep % 2 === 1){
      const bOsc = audioCtx.createOscillator();
      const bFilter = audioCtx.createBiquadFilter();
      const bGain = audioCtx.createGain();
      bOsc.type = 'sawtooth';
      bOsc.frequency.setValueAtTime(55, now); // A1 note
      bFilter.type = 'lowpass';
      bFilter.frequency.setValueAtTime(420, now);
      bFilter.frequency.exponentialRampToValueAtTime(80, now + 0.07);
      bGain.gain.setValueAtTime(0.1, now);
      bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

      bOsc.connect(bFilter);
      bFilter.connect(bGain);
      bGain.connect(audioCtx.destination);
      bOsc.start(now);
      bOsc.stop(now + 0.07);
    }
    musicStep = (musicStep + 1) % 16;
  }, 108.7);
}

// --- Three.js 3D Scene Setup ---
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

camera.position.copy(CAM_BASE);
camera.lookAt(0, 0.4, -14);

// Balanced lighting
scene.add(new THREE.AmbientLight(0x8a6fd8, 0.8));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);

scene.add(frontHeadlight);

// Starfield
{

  for (let i = 0; i < n; i++){

// Violet singularity glow
{
  const glow = new THREE.Mesh(

// Expanding shockwave rings pool
const rings = [];
function spawnRing(pos, color, maxRadius){
  const geom = new THREE.RingGeometry(0.2, 0.45, 32);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.95 });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.copy(pos);
  mesh.rotation.x = Math.PI / 2;
  mesh.userData = { r: 0.45, maxR: maxRadius || 4.5, life: 1.0 };
  scene.add(mesh);
  rings.push(mesh);
}

// --- GLTF Model Loader with Strict Centering & High-Contrast Materials ---
const loader = new GLTFLoader();

function loadCenteredModel(url, scale = 1.0, isAlien = false){
  return loader.loadAsync(url).then(gltf => {
    const root = gltf.scene;

    // Calculate exact bounding box to eliminate Kenney grid offset [2, 0, 1.5]
    const box = new THREE.Box3().setFromObject(root);
    const center = box.getCenter(new THREE.Vector3());
    root.position.sub(center); // Centers model at (0, 0, 0)

    const wrapper = new THREE.Group();
    wrapper.add(root);
    wrapper.scale.setScalar(scale);

    if (isAlien){
      // Alien ships: sleek contrasting armor + vivid crimson accents & glowing red lights
      root.traverse(o => {
        if (o.isMesh && o.material){
          o.material = o.material.clone();
          if ('metalness' in o.material) o.material.metalness = 0.35;
          if ('roughness' in o.material) o.material.roughness = 0.55;

          if (o.material.name === 'metalRed'){
            o.material.color.setHex(0xff2244);
            if ('emissive' in o.material){
              o.material.emissive.setHex(0xff1133);
              o.material.emissiveIntensity = 0.7;
            }
          } else if (o.material.name === 'metal' || o.material.name === 'metalDark'){
            // Tactical gunmetal slate that catches the scene lights
            o.material.color.setHex(0x4a5568);
          } else if (o.material.name === 'dark'){
            o.material.color.setHex(0x242836);
          }
        }
      });
    }
    return wrapper;
  });
}

// Bounds & Flight Dimensions
const SPAN_X = 7.8;
const MIN_Z = 0.5;   // Pushed forward into corridor
const MAX_Z = 5.5;   // Pulled back near camera
const FRONT_Z = -65;
const BACK_Z = 12;

let player = null, playerProto = null;
let foeProtos = [], meteorProtos = [];
let thrusterL = null, thrusterR = null;

const foes = [], bolts = [], foeBolts = [], blasts = [];
let score = 0, lives = 3, combo = 0, running = false, lastT = 0;
let fireT = 0, trauma = 0, hitstopT = 0;

// --- Full 2D Flight Controls (Relative Drag on Mobile, WASD/Arrows on Desktop) ---
const targetPos = new THREE.Vector2(0, 3.8); // x, z
let isDragging = false;
let dragOrigin = { x: 0, y: 0 };
let shipOrigin = { x: 0, z: 3.8 };

cv.addEventListener('pointerdown', e => {
  isDragging = true;
  dragOrigin.x = e.clientX;
  dragOrigin.y = e.clientY;
  if (player){
    shipOrigin.x = player.position.x;
    shipOrigin.z = player.position.z;
  }
});

cv.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = (e.clientX - dragOrigin.x);
  const dy = (e.clientY - dragOrigin.y);

  // Smooth relative 2D steering
  const factorX = (SPAN_X * 2.2) / window.innerWidth;
  const factorZ = ((MAX_Z - MIN_Z) * 2.2) / window.innerHeight;

  targetPos.x = THREE.MathUtils.clamp(shipOrigin.x + dx * factorX, -SPAN_X, SPAN_X);
  targetPos.y = THREE.MathUtils.clamp(shipOrigin.z + dy * factorZ, MIN_Z, MAX_Z);
});

const stopDrag = () => { isDragging = false; };
window.addEventListener('pointerup', stopDrag);
window.addEventListener('pointercancel', stopDrag);

// Desktop keyboard controls
const keys = { left: false, right: false, up: false, down: false };
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
});

function resize(){
  const w = cv.clientWidth, h = cv.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function triggerFlash(color, opacity){
  flashEl.style.background = color || '#fff';
  flashEl.style.opacity = opacity || '0.35';
  setTimeout(() => { flashEl.style.opacity = '0'; }, 70);
}

function showWaveBanner(text){
  waveBanner.textContent = text;
  waveBanner.classList.add('show');
  setTimeout(() => waveBanner.classList.remove('show'), 2200);
}

function bolt(color, isFoe = false){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(0.14, 0.14, 1.6),
    new THREE.MeshBasicMaterial({ color })
  );
  return m;
}

function blast(p, color, n){
  for (let i = 0; i < n; i++){
    const s = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 6, 6),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
    );
    s.position.copy(p);
    s.userData.v = new THREE.Vector3(
      (Math.random()-0.5)*10, (Math.random()-0.5)*6, (Math.random()-0.5)*10 + 4);
    s.userData.life = 0.65;
    scene.add(s); blasts.push(s);
  }
}

// Wave Choreography Engine
let currentWave = 1;
let waveTimer = 0;
let waveQueue = [];

function buildWave(num){
  const q = [];
  const speedBoost = Math.min(num * 1.5, 12);

  if (num % 3 === 1){
    // Formation 1: Harvester Scout Wing (V-formation)
    showWaveBanner(`WAVE ${num}: HARVESTER SCOUTS`);
    const cx = (Math.random()-0.5) * 4;
    q.push({ t: 0.0, type: 'foe', kind: 0, x: cx, z: FRONT_Z, v: 14 + speedBoost });
    q.push({ t: 0.5, type: 'foe', kind: 0, x: cx - 2.8, z: FRONT_Z, v: 14 + speedBoost });
    q.push({ t: 0.5, type: 'foe', kind: 0, x: cx + 2.8, z: FRONT_Z, v: 14 + speedBoost });
    q.push({ t: 1.8, type: 'foe', kind: 0, x: (Math.random()-0.5)*7, z: FRONT_Z, v: 15 + speedBoost });
    q.push({ t: 2.4, type: 'foe', kind: 0, x: (Math.random()-0.5)*7, z: FRONT_Z, v: 15 + speedBoost });
  } else if (num % 3 === 2){
    // Formation 2: Asteroid Gauntlet (lane gaps requiring 2D weaves)
    showWaveBanner(`WAVE ${num}: ASTEROID BELT`);
    for (let i = 0; i < 5; i++){
      const safeLane = (Math.random() - 0.5) * 6;
      q.push({ t: i * 0.75, type: 'meteor', x: safeLane - 3.2, z: FRONT_Z, v: 15 + speedBoost });
      q.push({ t: i * 0.75, type: 'meteor', x: safeLane + 3.2, z: FRONT_Z, v: 15 + speedBoost });
    }
  } else {
    // Formation 3: Heavy Harvester Carrier + Scout Escorts
    showWaveBanner(`WAVE ${num}: SIEGE CARRIER`);
    q.push({ t: 0.0, type: 'foe', kind: 1, x: 0, z: FRONT_Z, v: 11 + speedBoost, hp: 8 });
    q.push({ t: 0.9, type: 'foe', kind: 0, x: -4.2, z: FRONT_Z, v: 14 + speedBoost });
    q.push({ t: 0.9, type: 'foe', kind: 0, x: 4.2, z: FRONT_Z, v: 14 + speedBoost });
    q.push({ t: 2.2, type: 'meteor', x: (Math.random()-0.5)*6, z: FRONT_Z, v: 14 + speedBoost });
  }
  return q;
}

function spawnFoeObj(item){
  const proto = item.kind === 1 ? foeProtos[1] : foeProtos[0];
  const m = proto.clone(true);
  m.position.set(item.x, 0, item.z || FRONT_Z);
  m.rotation.y = Math.PI; // Face oncoming toward player
  m.userData = {
    v: item.v || 14,
    kind: item.kind || 0,
    hp: item.hp || (item.kind === 1 ? 5 : 1),
    r: item.kind === 1 ? 2.4 : 1.4
  };
  scene.add(m);
  foes.push(m);
}

function spawnMeteorObj(item){
  const proto = meteorProtos[Math.floor(Math.random()*meteorProtos.length)].clone(true);
  proto.position.set(item.x, 0, item.z || FRONT_Z);
  proto.userData = { v: item.v || 16, spin: (Math.random()-0.5)*3.5, r: 1.3 };
  scene.add(proto);
  foes.push(proto);
}

function hitTest(a, ar, b, br){
  const dx = a.x - b.x, dz = a.z - b.z;
  return dx*dx + dz*dz < (ar+br)*(ar+br);
}

function hurt(){
  lives--;
  combo = 0;
  comboEl.textContent = '';
  livesEl.textContent = lives;
  trauma = Math.min(1.0, trauma + 0.85);
  triggerFlash('#ff3b3b', 0.45);
  playHurtSound();
  spawnRing(player.position, 0xff4d4d, 5.5);
  blast(player.position, 0xff5d5d, 28);

  if (lives <= 0){
    running = false;
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = 'BREACH COLLAPSED';
    overlay.querySelector('p').innerHTML =
      `Your racer yielded <b>${score}</b> resonance units before signal loss.<br><br>` +
      'Stream the full album: <a href="index.html" style="color:#b678ff">DRACONIS portal</a>';
    startBtn.textContent = 'RE-IGNITE';
  }
}

// Load CC0 Models with calibrated scales
Promise.all([
  loadCenteredModel('assets/ships/craft_racer.glb', 1.3, false),
  loadCenteredModel('assets/ships/craft_miner.glb', 1.4, true),    // Fast Harvester Skiff
  loadCenteredModel('assets/ships/craft_cargoB.glb', 2.2, true),   // Heavy Dreadnought Carrier
  loadCenteredModel('assets/ships/meteor.glb', 2.0, false),
  loadCenteredModel('assets/ships/meteor_detailed.glb', 2.4, false)
]).then(([racer, miner, cargo, met1, met2]) => {
  playerProto = racer;
  foeProtos = [miner, cargo];
  meteorProtos = [met1, met2];
  startBtn.disabled = false;
  startBtn.textContent = 'IGNITE DRIVE';
}).catch(err => {
  console.error(err);
  overlay.querySelector('p').textContent = 'Ship models failed to load. Please refresh.';
});
startBtn.disabled = true;
startBtn.textContent = 'CALIBRATING SHIPS…';

function reset(){
  if (player) scene.remove(player);
  player = playerProto.clone(true);
  player.position.set(0, 0, 3.8);
  scene.add(player);

  // Twin cyan thruster cones
  const plumeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.85 });
  const plumeGeom = new THREE.ConeGeometry(0.12, 0.75, 8);
  plumeGeom.rotateX(-Math.PI / 2);
  thrusterL = new THREE.Mesh(plumeGeom, plumeMat);
  thrusterR = new THREE.Mesh(plumeGeom, plumeMat.clone());
  thrusterL.position.set(-0.35, -0.05, 1.3);
  thrusterR.position.set(0.35, -0.05, 1.3);
  player.add(thrusterL);
  player.add(thrusterR);

  [...foes, ...bolts, ...foeBolts, ...blasts, ...rings].forEach(o => scene.remove(o));
  foes.length = bolts.length = foeBolts.length = blasts.length = rings.length = 0;

  score = 0; lives = 3; combo = 0;
  targetPos.set(0, 3.8);
  scoreEl.textContent = '0'; livesEl.textContent = '3'; comboEl.textContent = '';
  currentWave = 1;
  waveQueue = buildWave(currentWave);
  waveTimer = 0; fireT = 0; trauma = 0; hitstopT = 0;
}

let foeFireT = 1.3;

function loop(t){
  if (!running) return;
  requestAnimationFrame(loop);

  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  if (hitstopT > 0){
    hitstopT -= dt;
    return; // Micro-freeze impact
  }

  // Keyboard controls override
  if (keys.left) targetPos.x = Math.max(-SPAN_X, targetPos.x - 22 * dt);
  if (keys.right) targetPos.x = Math.min(SPAN_X, targetPos.x + 22 * dt);
  if (keys.up) targetPos.y = Math.max(MIN_Z, targetPos.y - 18 * dt);
  if (keys.down) targetPos.y = Math.min(MAX_Z, targetPos.y + 18 * dt);

  // Smooth 2D Flight Dynamics
  const px = player.position.x;
  const pz = player.position.z;
  const vx = (targetPos.x - px);
  const vz = (targetPos.y - pz);

  player.position.x += vx * Math.min(1, dt * 14);
  player.position.z += vz * Math.min(1, dt * 12);
  // Natural depth perspective: pushing forward dips slightly, pulling back rises
  player.position.y = (4.0 - player.position.z) * 0.12 + Math.sin(t * 0.003) * 0.06;

  // Cinematic banking and pitch
  player.rotation.z = THREE.MathUtils.clamp(-vx * 0.45, -0.65, 0.65);
  player.rotation.x = THREE.MathUtils.clamp(-vz * 0.18, -0.25, 0.25);
  player.rotation.y = THREE.MathUtils.clamp(-vx * 0.12, -0.2, 0.2);

  // Pulsing thruster plume
  const thrusterScale = 1.0 + Math.sin(t * 0.035) * 0.35;
  if (thrusterL && thrusterR){
    thrusterL.scale.set(1, 1, thrusterScale);
    thrusterR.scale.set(1, 1, thrusterScale);
  }

  // Dual plasma auto-fire
  fireT -= dt;
  if (fireT <= 0){
    fireT = 0.18;
    playLaserSound(true);
    [-0.55, 0.55].forEach(dx => {
      const b = bolt(0xe0b0ff, false);
      b.position.set(player.position.x + dx, player.position.y, player.position.z - 1.4);
      scene.add(b); bolts.push(b);
    });
  }

  // Wave processing
  waveTimer += dt;
  while (waveQueue.length && waveQueue[0].t <= waveTimer){
    const item = waveQueue.shift();
    if (item.type === 'foe') spawnFoeObj(item);
    else if (item.type === 'meteor') spawnMeteorObj(item);
  }

  if (waveQueue.length === 0 && foes.length === 0){
    currentWave++;
    waveQueue = buildWave(currentWave);
    waveTimer = 0;
  }

  // Alien ships return fire
  foeFireT -= dt;
  if (foeFireT <= 0 && foes.length){
    foeFireT = Math.max(0.85, 1.7 - currentWave * 0.08);
    const armed = foes.filter(f => f.userData.kind !== undefined && f.position.z < -6);
    if (armed.length){
      const shooter = armed[Math.floor(Math.random() * armed.length)];
      playLaserSound(false);
      const b = bolt(0xff2244, true);
      b.position.set(shooter.position.x, shooter.position.y, shooter.position.z + 1.2);
      scene.add(b); foeBolts.push(b);
    }
  }

  // Player plasma advancement & impact
  for (let i = bolts.length-1; i >= 0; i--){
    const b = bolts[i];
    b.position.z -= 65 * dt;
    if (b.position.z < FRONT_Z - 5){ scene.remove(b); bolts.splice(i, 1); continue; }

    for (let j = foes.length-1; j >= 0; j--){
      const f = foes[j];
      const r = f.userData.r || 1.3;
      if (hitTest(b.position, 0.45, f.position, r)){
        scene.remove(b); bolts.splice(i, 1);
        f.userData.hp = (f.userData.hp || 1) - 1;

        if (f.userData.hp <= 0){
          const isHeavy = f.userData.kind === 1;
          scene.remove(f); foes.splice(j, 1);
          combo++;
          const pts = (isHeavy ? 30 : 10) * Math.min(combo, 8);
          score += pts;
          scoreEl.textContent = score;
          comboEl.textContent = combo > 1 ? ` (x${combo})` : '';

          trauma = Math.min(0.85, trauma + (isHeavy ? 0.45 : 0.28));
          hitstopT = 0.035;
          playExplosionSound(isHeavy);
          spawnRing(f.position, 0xb678ff, isHeavy ? 6.0 : 3.8);
          blast(f.position, isHeavy ? 0xff4d6d : 0xc8b6ff, isHeavy ? 28 : 18);
        } else {
          // Impact flash on hull
          blast(b.position, 0xffffff, 4);
        }
        break;
      }
    }
  }

  // Foe laser bolts towards player
  for (let i = foeBolts.length-1; i >= 0; i--){
    const b = foeBolts[i];
    b.position.z += 28 * dt;
    if (b.position.z > BACK_Z){ scene.remove(b); foeBolts.splice(i, 1); continue; }
    if (hitTest(b.position, 0.45, player.position, 0.95)){
      scene.remove(b); foeBolts.splice(i, 1);
      hurt();
      if (!running) return;
    }
  }

  // Oncoming foes & collision
  for (let i = foes.length-1; i >= 0; i--){
    const f = foes[i];
    f.position.z += (f.userData.v || 14) * dt;
    if (f.userData.spin) f.rotation.y += f.userData.spin * dt;
    if (f.position.z > BACK_Z){ scene.remove(f); foes.splice(i, 1); continue; }

    if (hitTest(f.position, f.userData.r || 1.3, player.position, 0.95)){
      scene.remove(f); foes.splice(i, 1);
      hurt();
      if (!running) return;
    }
  }

  // Debris particles
  for (let i = blasts.length-1; i >= 0; i--){
    const p = blasts[i];
    p.position.addScaledVector(p.userData.v, dt);
    p.userData.life -= dt;
    p.material.opacity = Math.max(0, p.userData.life * 1.6);
    if (p.userData.life <= 0){ scene.remove(p); blasts.splice(i, 1); }
  }

  // Shockwave rings
  for (let i = rings.length-1; i >= 0; i--){
    const ring = rings[i];
    ring.userData.life -= dt * 2.2;
    ring.userData.r += (ring.userData.maxR - ring.userData.r) * dt * 8;
    ring.scale.set(ring.userData.r, ring.userData.r, 1);
    ring.material.opacity = Math.max(0, ring.userData.life);
    if (ring.userData.life <= 0){ scene.remove(ring); rings.splice(i, 1); }
  }

  // Camera Shake & Dynamic Follow
  if (trauma > 0){
    trauma = Math.max(0, trauma - dt * 2.2);
    const shakeMag = trauma * trauma * 0.48;
    camera.position.x = CAM_BASE.x + (Math.random() - 0.5) * shakeMag + (player.position.x * 0.18);
    camera.position.y = CAM_BASE.y + (Math.random() - 0.5) * shakeMag;
    camera.position.z = CAM_BASE.z;
  } else {
    camera.position.x += ((player.position.x * 0.18) - camera.position.x) * Math.min(1, dt * 5);
    camera.position.y = CAM_BASE.y;
    camera.position.z = CAM_BASE.z;
  }
  camera.lookAt(camera.position.x * 0.4, 0.2, -14);

  renderer.render(scene, camera);
}

startBtn.addEventListener('click', () => {
  if (!playerProto) return;
  initAudio();
  start138Music();
  overlay.classList.add('hidden');
  resize(); reset();
  running = true; lastT = performance.now();
  requestAnimationFrame(loop);
});
resize();
</script>
</body>
</html>
