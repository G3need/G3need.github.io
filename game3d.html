<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DRACONIS: Breach Run 3D — mini game</title>
<meta name="description" content="Fly the breach in 3D. Official DRACONIS mini-game by Ahmed Geneed. Ships: Kenney Space Kit (CC0).">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#07030f; overflow:hidden;
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif; touch-action:none;
    -webkit-user-select:none; user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; }
  #hud { display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px; color:#c9a7ff; font-size:14px; letter-spacing:.08em; z-index:2; }
  #hud b { color:#fff; }
  #cv { flex:1; width:100%; display:block; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    color:#efe6ff; background:rgba(7,3,15,.72); z-index:3; padding:24px; }
  #overlay h1 { font-size:clamp(22px,6vw,40px); letter-spacing:.12em; color:#b678ff; }
  #overlay p { font-size:14px; line-height:1.6; max-width:420px; color:#cbb8ee; }
  #overlay button { background:#7b2fff; color:#fff; border:0; border-radius:999px;
    padding:14px 42px; font-size:16px; letter-spacing:.1em; cursor:pointer; }
  #overlay button:active { transform:scale(.96); }
  #overlay a { color:#8f6fd8; font-size:13px; }
  .hidden { display:none !important; }
  #credit { position:absolute; bottom:6px; right:10px; font-size:10px; color:#5b4a7a; z-index:2; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>ENERGY <b id="score">0</b></span><span>138 BPM</span><span>HULL <b id="lives">3</b></span></div>
  <canvas id="cv"></canvas>
  <div id="overlay">
    <h1>BREACH RUN 3D</h1>
    <p>Harvester skiffs seed-collapse every rich target. You are the richest target on Earth.<br><br>Drag to steer your racer. Survive the breach.</p>
    <button id="start">IGNITE DRIVE</button>
    <a href="index.html">← back to the portal</a>
  </div>
  <div id="credit">ships: Kenney Space Kit (CC0)</div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Draconis rail shooter: player racer vs Harvester skiffs + meteors.
// Steer: drag anywhere (mouse + touch). Ship auto-fires.
const cv = document.getElementById('cv');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start');

const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07030f);
scene.fog = new THREE.Fog(0x07030f, 30, 95);
const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 220);
camera.position.set(0, 3.4, 9);
camera.lookAt(0, 0.6, -12);

scene.add(new THREE.AmbientLight(0x8a6fd8, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(4, 8, 6);
scene.add(key);
const rim = new THREE.DirectionalLight(0x7b2fff, 1.1);
rim.position.set(-5, 2, -6);
scene.add(rim);

// starfield
{
  const n = 700, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++){
    pos[i*3] = (Math.random()-0.5) * 160;
    pos[i*3+1] = (Math.random()-0.5) * 100;
    pos[i*3+2] = -Math.random() * 180;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xbfa8ff, size: 0.35 })));
}

// violet breach glow far ahead
{
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(9, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0x4a1fa0, transparent: true, opacity: 0.5, fog: false })
  );
  glow.position.set(0, 0, -150);
  scene.add(glow);
}

const loader = new GLTFLoader();
function loadShip(url){
  return loader.loadAsync(url).then(g => g.scene);
}
// Harvester skiffs: bulky haulers re-skinned obsidian with a violet heart.
function obsidianize(obj){
  obj.traverse(o => {
    if (o.isMesh){
      o.material = o.material.clone();
      o.material.color.setHex(0x11111c);
      if ('emissive' in o.material) o.material.emissive.setHex(0x2a0f5e);
    }
  });
  return obj;
}

const BERTH = { x: 9, top: 7, bottom: -4.5, front: -60, back: 12 };
let player = null, playerProto = null;
const foes = [], bolts = [], foeBolts = [], blasts = [];
let score = 0, lives = 3, running = false, lastT = 0;
let spawnT = 0, fireT = 0, foeFireT = 0;
const steer = { x: 0, y: 0 };

function setSteer(cx, cy){
  const r = cv.getBoundingClientRect();
  steer.x = ((cx - r.left) / r.width - 0.5) * 2 * BERTH.x;
  steer.y = -((cy - r.top) / r.height - 0.5) * 2 * 5;
  steer.y = Math.max(BERTH.bottom, Math.min(BERTH.top, steer.y));
}
cv.addEventListener('pointerdown', e => setSteer(e.clientX, e.clientY));
cv.addEventListener('pointermove', e => {
  if (e.buttons || e.pointerType === 'touch') setSteer(e.clientX, e.clientY);
});

function resize(){
  const w = cv.clientWidth, h = cv.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function bolt(color){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.12, 1.4),
    new THREE.MeshBasicMaterial({ color })
  );
  return m;
}
function blast(p, color, n){
  for (let i = 0; i < n; i++){
    const s = new THREE.Mesh(
      new THREE.SphereGeometry(0.09, 6, 6),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
    );
    s.position.copy(p);
    s.userData.v = new THREE.Vector3(
      (Math.random()-0.5)*8, (Math.random()-0.5)*8, (Math.random()-0.5)*8 + 4);
    s.userData.life = 0.6;
    scene.add(s); blasts.push(s);
  }
}
function spawnFoe(kind){
  const proto = kind === 0 ? foeProtos[0] : foeProtos[1];
  const m = proto.clone();
  m.position.set((Math.random()-0.5) * 2 * BERTH.x * 0.9,
    Math.random() * (BERTH.top - 1), BERTH.front);
  m.rotation.y = Math.PI;
  m.userData = { v: 11 + Math.random()*7 + score*0.02,
    weave: Math.random()*Math.PI*2, kind,
    hp: kind === 1 ? 3 : 1, r: kind === 1 ? 1.6 : 1.2 };
  scene.add(m); foes.push(m);
}
function spawnMeteor(){
  const m = meteorProtos[Math.floor(Math.random()*meteorProtos.length)].clone();
  m.position.set((Math.random()-0.5) * 2 * BERTH.x,
    Math.random() * (BERTH.top - 2) - 2, BERTH.front - 10);
  m.userData = { v: 14 + Math.random()*8, spin: (Math.random()-0.5)*3, r: 1.1 };
  scene.add(m); foes.push(m);
}
function hitTest(a, ar, b, br){
  const dx = a.x-b.x, dy = a.y-b.y, dz = a.z-b.z;
  return dx*dx + dy*dy + dz*dz < (ar+br)*(ar+br);
}
function hurt(){
  lives--; livesEl.textContent = lives;
  blast(player.position, 0xff5d5d, 22);
  if (lives <= 0){
    running = false;
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = 'SIGNAL LOST';
    overlay.querySelector('p').innerHTML =
      'The breach took ' + score + ' units of exotic energy with it.<br><br>' +
      'Listen to the journey: <a href="index.html" style="color:#b678ff">DRACONIS portal</a>';
    startBtn.textContent = 'RE-IGNITE';
  }
}

let foeProtos = [], meteorProtos = [];
Promise.all([
  loadShip('assets/ships/craft_racer.glb'),
  loadShip('assets/ships/craft_cargoB.glb').then(obsidianize),
  loadShip('assets/ships/craft_miner.glb').then(obsidianize),
  loadShip('assets/ships/meteor.glb'),
  loadShip('assets/ships/meteor_detailed.glb')
]).then(([racer, cargo, miner, met1, met2]) => {
  playerProto = racer;
  foeProtos = [cargo, miner];
  meteorProtos = [met1, met2];
  startBtn.disabled = false;
  startBtn.textContent = 'IGNITE DRIVE';
}).catch(() => {
  overlay.querySelector('p').textContent = 'Ship models failed to load — check connection and retry.';
});
startBtn.disabled = true;
startBtn.textContent = 'LOADING SHIPS…';

function reset(){
  if (player) scene.remove(player);
  player = playerProto.clone();
  player.position.set(0, 0, 4);
  scene.add(player);
  [...foes, ...bolts, ...foeBolts, ...blasts].forEach(o => scene.remove(o));
  foes.length = bolts.length = foeBolts.length = blasts.length = 0;
  score = 0; lives = 3; spawnT = 0.5; fireT = 0; foeFireT = 2;
  scoreEl.textContent = '0'; livesEl.textContent = '3';
}

function loop(t){
  if (!running) return;
  requestAnimationFrame(loop);
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  // steer with banking
  const px = player.position.x, targetX = steer.x;
  player.position.x += (targetX - px) * Math.min(1, dt * 7);
  player.position.y += (steer.y - player.position.y) * Math.min(1, dt * 7);
  player.rotation.z = THREE.MathUtils.clamp((px - player.position.x) * 0.35, -0.7, 0.7);
  player.position.z = 4 + Math.sin(t * 0.002) * 0.15;

  // auto-fire twin bolts
  fireT -= dt;
  if (fireT <= 0){
    fireT = 0.22;
    [-0.55, 0.55].forEach(dx => {
      const b = bolt(0xe6ccff);
      b.position.set(player.position.x + dx, player.position.y, player.position.z - 1.5);
      scene.add(b); bolts.push(b);
    });
  }
  // spawns
  spawnT -= dt;
  if (spawnT <= 0){
    spawnT = Math.max(0.45, 1.4 - score * 0.004);
    if (Math.random() < 0.3) spawnMeteor();
    else spawnFoe(Math.random() < 0.35 ? 1 : 0);
  }
  // foes return fire
  foeFireT -= dt;
  if (foeFireT <= 0 && foes.length){
    foeFireT = 1.6;
    const f = foes[Math.floor(Math.random() * foes.length)];
    const b = bolt(0xff4d6d);
    b.position.copy(f.position);
    scene.add(b); foeBolts.push(b);
  }
  // advance bolts
  for (let i = bolts.length-1; i >= 0; i--){
    const b = bolts[i];
    b.position.z -= 55 * dt;
    if (b.position.z < BERTH.front - 5){ scene.remove(b); bolts.splice(i,1); continue; }
    for (let j = foes.length-1; j >= 0; j--){
      const f = foes[j];
      if (hitTest(b.position, 0.5, f.position, f.userData.r || 1.2)){
        scene.remove(b); bolts.splice(i,1);
        f.userData.hp = (f.userData.hp || 1) - 1;
        if (f.userData.hp <= 0){
          scene.remove(f); foes.splice(j,1);
          score += 10; scoreEl.textContent = score;
          blast(f.position, 0xb678ff, 16);
        }
        break;
      }
    }
  }
  // foe bolts at player
  for (let i = foeBolts.length-1; i >= 0; i--){
    const b = foeBolts[i];
    b.position.z += 26 * dt;
    if (b.position.z > BERTH.back){ scene.remove(b); foeBolts.splice(i,1); continue; }
    if (hitTest(b.position, 0.5, player.position, 0.9)){
      scene.remove(b); foeBolts.splice(i,1); hurt();
      if (!running) return;
    }
  }
  // foes drift + collide
  for (let i = foes.length-1; i >= 0; i--){
    const f = foes[i];
    f.position.z += (f.userData.v || 12) * dt;
    if (f.userData.weave !== undefined){
      f.userData.weave += dt * 2;
      f.position.x += Math.sin(f.userData.weave) * dt * 2;
    }
    if (f.userData.spin) f.rotation.y += f.userData.spin * dt;
    if (f.position.z > BERTH.back){ scene.remove(f); foes.splice(i,1); continue; }
    if (hitTest(f.position, f.userData.r || 1.2, player.position, 0.9)){
      scene.remove(f); foes.splice(i,1); hurt();
      if (!running) return;
    }
  }
  // blast particles
  for (let i = blasts.length-1; i >= 0; i--){
    const p = blasts[i];
    p.position.addScaledVector(p.userData.v, dt);
    p.userData.life -= dt;
    p.material.opacity = Math.max(0, p.userData.life * 1.6);
    if (p.userData.life <= 0){ scene.remove(p); blasts.splice(i,1); }
  }
  // chase camera follows steer slightly
  camera.position.x += (steer.x * 0.25 - camera.position.x) * Math.min(1, dt * 3);
  camera.lookAt(camera.position.x * 0.5, 0.6, -12);
  renderer.render(scene, camera);
}

startBtn.addEventListener('click', () => {
  if (!playerProto) return;
  overlay.classList.add('hidden');
  resize(); reset();
  running = true; lastT = performance.now();
  requestAnimationFrame(loop);
});
resize();
</script>
</body>
</html>
